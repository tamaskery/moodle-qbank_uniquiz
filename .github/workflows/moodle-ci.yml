name: Moodle Plugin CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle: MOODLE_405_STABLE
            database: pgsql
          - moodle: MOODLE_502_STABLE
            database: pgsql
          - moodle: MOODLE_503_STABLE
            database: pgsql
          - moodle: MOODLE_503_STABLE
            database: mariadb
    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated files
        working-directory: plugin
        run: |
          npm ci --prefix .build/tools
          node .build/tools/build.mjs
          git diff --exit-code -- amd templates lang styles.css examples ENGINE-SOURCES.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, mysqli, intl, mbstring, soap, zip, gd
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none
      - name: Prepare Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle
        id: install
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle }}
      - name: PHP syntax
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phplint
      - name: PHP coding standard
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpcs --max-warnings 0
      - name: PHP documentation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Plugin validation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci validate
      - name: Savepoints
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci savepoints
      - name: Mustache
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci mustache
      - name: Frontend lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0
      - name: PHPUnit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Behat
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci behat --profile chrome
